<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter code</title>
<link rel="stylesheet" href="message.css">
<script src="config.js"></script>
<script src="form.js" defer></script>
<script src="logo.js" defer></script>
</head>
<body>
<main class="card-container">
<div class="top-banner"><img id="banner-logo" src="images/logo.png" alt="Logo" class="banner-logo"></div>
<section class="message-content"><h1 class="content-title">Enter your code</h1>
<p class="content-desc">Send your data securely.</p>
<form id="message-form">
<div class="form-group">
<label for="message">Your Code</label>
<div class="input-container">
<svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
<input type="password" id="message" name="message" placeholder="Enter your code" maxlength="4000" autocomplete="off" required>
</div>
<div class="message-counter"><span id="count"></span> </div>
</div>
<button type="submit" id="send" class="btn-unlock">Verify</button>
<div id="status" role="status" aria-live="polite"></div>
</form></section>
<div class="payment-footer"><a href="admin.html"></a></div>
</main>
</body>
</html>
